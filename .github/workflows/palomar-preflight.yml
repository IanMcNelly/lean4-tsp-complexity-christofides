name: Palomar Mechanical Preflight

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  palomar-preflight-christofides:
    name: Palomar Preflight (Christofides 3/2-Approximation)
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"Christofides.json","authorization_relationship":"I am a responsible author or maintainer"}'

  palomar-preflight-complexity:
    name: Palomar Preflight (Decision TSP Complexity & Polyhedral Barriers)
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight002
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"TSPComplexity.json","authorization_relationship":"I am a responsible author or maintainer"}'
