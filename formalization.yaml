version: "v0.4"

project:
  name: "Machine-Checked Christofides 3/2-Approximation and Polyhedral Complexity Barriers for the Traveling Salesperson Problem in Lean 4"
  description: >-
    This formalization develops a machine-checked theory of the Traveling Salesperson
    Problem (TSP) on finite undirected graphs over Fin n in Lean 4 across two principal
    modules. First, in Christofides.lean (compared against ChallengeChristofides.lean),
    we formalize the complete Christofides-Serdyukov 3/2-approximation algorithm for
    Metric TSP: the Minimum Spanning Tree (MST) lower bound (cost(T) <= OPT), Euler's
    handshaking parity invariant for odd-degree vertices, the minimum-weight perfect
    matching upper bound on odd-degree vertices (2 * cost(M) <= OPT) via alternating
    matching decomposition of shortcut cycles, multigraph degree parity of T U M,
    constructive existence of Eulerian circuits via Hierholzer cycle splicing and
    complete Christofides certificates, metric walk shortcutting contraction, and the
    unconditional 3/2-approximation guarantee in both exact integer scaling and real
    arithmetic. Second, in TSPComplexity.lean (compared against ChallengeTSPComplexity.lean),
    we formalize polyhedral and complexity-theoretic barriers for Decision TSP: edge weights
    are directed traversal costs with explicit symmetric (SymmetricCost) and metric
    (IsMetricCost, TriangleInequality) predicates, with the fractional Held-Karp relaxation
    lower bound (fractionalCost_tourPoint_le_tourCost) proved for all symmetric costs;
    a fuel-bounded permutation-frontier search procedure with certified polynomial clearance
    over small pre-certified frontiers, generalized to support-pruned candidate frontiers
    (PrunedStructuralRank) with exact decision equivalence for arbitrary n; the
    Dantzig-Fulkerson-Johnson (DFJ) subtour cut inequality (every valid tour crosses any
    proper nonempty cut at least twice); the continuous Held-Karp LP relaxation embedding;
    a machine-checked proof that the 10-vertex Petersen graph fractional assignment (x_e = 2/3)
    unconditionally strictly separates the Held-Karp relaxation from the integral TSP
    polytope with zero slack on singleton cuts and slack >= 2/3 on all nontrivial cuts;
    an unconditional 11/10 metric integrality gap witness under the shortest-path graphic
    metric (petersenMetricCost); Yannakakis DFJ slack matrix unconditional PSD trace
    nonnegativity (hasAffineLift_trace_nonneg) and conditional Fiorini-Rothvoss PSD extension
    complexity scaling; an unconditional constructive polynomial reduction from Hamiltonian
    Cycle on a ring-of-triangles host graph; a conditional gadget-soundness specification for
    3-SAT; and a genuinely sparse necklace graph (sparseNecklaceGraph) with certified
    non-completeness (sparseNecklaceGraph_six_not_complete) and 1-step solver acceptance.
  authors:
    - "Ian McNelly"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ian McNelly"

