status:
  scope: >-
    Finite graphs are represented over Fin n with integer edge costs CostFunction n := Fin n -> Fin n -> Nat,
    which define directed traversal weights along cycle edges (with real-valued LP vectors FractionalAssignment n
    := Fin n -> Fin n -> Real). In Christofides.lean, the entire 3/2-approximation pipeline is formalized
    unconditionally for all n >= 3 and any metric cost function IsMetricCost c, including constructive finite
    existence proofs for MSTs, minimum-weight perfect matchings on odd-degree vertices, and Eulerian circuits
    (exists_christofidesCertificate, christofides_certificate_approx_ratio_nat_unconditional,
    christofides_certificate_approx_ratio_unconditional). In TSPComplexity.lean: (1) Edge costs are directed
    traversal weights with explicit symmetric (SymmetricCost) and metric (IsMetricCost, TriangleInequality)
    predicates, and the fractional Held-Karp objective lower bound fractionalCost_tourPoint_le_tourCost is proved
    for all symmetric costs. (2) The state machine is a fuel-bounded permutation-frontier search procedure
    (step, run) with certified polynomial clearance over small pre-certified frontiers (the rank-1 bound
    n! <= n^1 in StructuralRank n G c 1 holds on the full permutation frontier for n <= 2); Section 8 resolves
    this by introducing support-pruned candidate frontiers (PrunedStructuralRank), proving exact decision
    equivalence and constructive non-vacuity for all n >= 3 (pruned_structural_solver_decides_tsp,
    prunedStructuralRank_inhabited_all_ge_three). (3) The genuine sparse necklace graph sparseNecklaceGraph n hn
    provides a sparse 2-regular cycle host with internal variable triangles, certified non-complete at n = 6
    (sparseNecklaceGraph_six_not_complete) and accepted in 1 step for all n >= 3
    (pruned_solver_accepts_sparseNecklace_all_ge_three). (4) The Held-Karp separation on the 10-vertex Petersen
    graph (petersenFractional_not_mem_tspPolytope, petersen_strictly_separates_held_karp) and its exact DFJ slack
    profile (petersen_dfjSlack_singleton_zero, petersen_dfjSlack_nontrivial_ge_two_thirds) are proved
    unconditionally. (5) Under the graphic shortest-path metric petersenMetricCost (proved metric via
    petersenMetricCost_isMetric), the Held-Karp relaxation achieves cost <= 10 while every integral Hamiltonian tour
    incurs cost >= 11 (petersen_metric_tourCost_ge_eleven), establishing an unconditional >= 11/10 metric integrality
    gap (petersen_heldKarp_metric_integrality_gap). (6) Any affine PSD lift HasAffineLift n r unconditionally induces
    nonnegative trace inner products across all DFJ cuts and valid tours (hasAffineLift_trace_nonneg), with super-polynomial
    PSD extension complexity (tsp_extension_complexity_lower_bound) proved conditionally under
    SatisfiesFioriniRothvossBound n r C. (7) 3-SAT is formalized as a conditional gadget-soundness specification
    (sat_to_tsp_reduction_correct) parameterized by TSPGadget F, complemented by an unconditional constructed
    polynomial-time reduction from Hamiltonian Cycle to Decision TSP (hc_to_tsp_reduction_correct).
