fidelity:
  divergences: >-
    Graphs are formalized over canonical finite vertex types Fin n with integer edge weights
    defining directed traversal costs along cycle edges, coerced to Real for LP relaxations and 3/2 ratio statements,
    with explicit SymmetricCost and IsMetricCost predicates. In TSPComplexity.lean, the Fiorini-Rothvoss dimension bound
    is stated as an explicit hypothesis (SatisfiesFioriniRothvossBound), and the 3-SAT reduction is parameterized by
    the TSPGadget structure alongside the concrete Hamiltonian Cycle reduction hc_to_tsp_reduction_correct.

