      lean: "IJM.TSP.MSTCost_le_OPT"
      module: "Christofides"
      status: "proved"
      note: "Proved by deleting one edge from an optimal Hamiltonian tour to form a spanning path tree."
    - source: "Euler's Handshaking Parity Invariant on odd-degree vertices"
      lean: "IJM.TSP.even_card_oddDegreeVertices"
      module: "Christofides"
      status: "proved"
      note: "Proved for arbitrary loopless undirected edge finsets on Fin n."
    - source: "Perfect matching cardinality invariant 2 * |M| = |S|"
      lean: "IJM.TSP.perfectMatching_card_two_mul"
      module: "Christofides"
      status: "proved"
      note: "Proved by double-counting incident matching edges across S."
    - source: "Christofides (1976), minimum-weight perfect matching bound 2 * cost(M) <= OPT"
      lean: "IJM.TSP.matchingCost_le_half_OPT"
      module: "Christofides"
      status: "proved"
      note: "Proved by shortcutting an optimal tour to the even-cardinality odd-degree vertex set and decomposing into two alternating matchings."
    - source: "Christofides (1976), Eulerian multigraph even degree invariant"
